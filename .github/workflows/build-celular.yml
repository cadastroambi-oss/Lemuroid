name: Build Lemuroid+ (controle pelo celular)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble APK
        run: ./gradlew assembleFreeDynamicRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp lemuroid-app/build/outputs/apk/freeDynamic/release/*.apk out/LemuroidPlus-celular.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LemuroidPlus-celular
          path: out/LemuroidPlus-celular.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lemuroid+ build ${{ github.run_number }}
          files: out/LemuroidPlus-celular.apk
