<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1b22">
<meta name="mobile-web-app-capable" content="yes">
<title>Controle Lemuroid</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b22; color: #e8e6f0; font-family: system-ui, -apple-system, Roboto, sans-serif; touch-action: none; overscroll-behavior: none; }

  #pad { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto 1fr; padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

  .shoulder { height: 52px; border-radius: 14px 14px 6px 6px; background: #3a3946; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #c9c6d6; }
  #L { grid-column: 1; grid-row: 1; margin-right: 18%; }
  #R { grid-column: 3; grid-row: 1; margin-left: 18%; }

  #top { grid-column: 2; grid-row: 1; display: flex; gap: 8px; align-items: center; justify-content: center; padding: 0 10px; }
  .small { padding: 0 12px; height: 34px; border-radius: 17px; background: #2c2b36; color: #b9b6c8; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
  .shortcut.hidden { display: none; }

  #left { grid-column: 1; grid-row: 2; display: flex; align-items: center; justify-content: center; }
  #center { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 8px; }
  #right { grid-column: 3; grid-row: 2; display: flex; align-items: center; justify-content: center; }

  #player { font-size: 15px; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: #2c2b36; }
  #player .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: #777; vertical-align: 0; }
  .sysbtns { display: flex; gap: 14px; }
  .sys { width: 70px; height: 26px; border-radius: 13px; background: #3a3946; transform: rotate(-20deg); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: .5px; color: #b9b6c8; }

  #dpad { position: relative; width: min(42vh, 40vw); height: min(42vh, 40vw); max-width: 220px; max-height: 220px; min-width: 150px; min-height: 150px; }
  #dpad .arm { position: absolute; background: #3a3946; }
  #dpad .h { left: 0; right: 0; top: 33.3%; height: 33.4%; border-radius: 10px; }
  #dpad .v { top: 0; bottom: 0; left: 33.3%; width: 33.4%; border-radius: 10px; }
  #dpad .lit { position: absolute; width: 33.4%; height: 33.4%; border-radius: 8px; background: #6c6a80; opacity: 0; }
  #dpad .lit.on { opacity: 1; }
  #lu { left: 33.3%; top: 0; } #ld { left: 33.3%; bottom: 0; } #ll { left: 0; top: 33.3%; } #lr { right: 0; top: 33.3%; }

  #face { position: relative; width: min(46vh, 42vw); height: min(46vh, 42vw); max-width: 240px; max-height: 240px; min-width: 160px; min-height: 160px; }
  .face { position: absolute; width: 36%; height: 36%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  #X { left: 32%; top: 0; background: #3b5bdb; }
  #Y { left: 0; top: 32%; background: #2f9e44; }
  #A { right: 0; top: 32%; background: #e03131; }
  #B { left: 32%; bottom: 0; background: #f08c00; }

  .pressed { filter: brightness(1.45); transform: scale(.94); }
  .sys.pressed { transform: rotate(-20deg) scale(.94); }

  #overlay { position: fixed; inset: 0; background: rgba(15,15,20,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; font-size: 17px; z-index: 10; }
  #overlay.hidden { display: none; }
  #overlay b { font-size: 22px; }
  #rotate { position: fixed; inset: 0; background: #1b1b22; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 18px; z-index: 20; }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="pad">
  <div id="L" class="shoulder btn" data-key="102">L</div>
  <div id="top">
    <div class="small shortcut" data-action="save">Salvar</div>
    <div class="small shortcut" data-action="load">Carregar</div>
    <div class="small shortcut" data-action="ff">Turbo</div>
    <div class="small shortcut" data-action="menu">Menu</div>
  </div>
  <div id="R" class="shoulder btn" data-key="103">R</div>

  <div id="left">
    <div id="dpad">
      <div class="arm h"></div><div class="arm v"></div>
      <div class="lit" id="lu"></div><div class="lit" id="ld"></div><div class="lit" id="ll"></div><div class="lit" id="lr"></div>
    </div>
  </div>

  <div id="center">
    <div id="player"><span class="dot"></span><span id="playerText">Conectando…</span></div>
    <div class="sysbtns">
      <div class="sys btn" data-key="109">SELECT</div>
      <div class="sys btn" data-key="108">START</div>
    </div>
  </div>

  <div id="right">
    <div id="face">
      <div id="X" class="face btn" data-key="99">X</div>
      <div id="Y" class="face btn" data-key="100">Y</div>
      <div id="A" class="face btn" data-key="96">A</div>
      <div id="B" class="face btn" data-key="97">B</div>
    </div>
  </div>
</div>

<div id="overlay"><b>Controle Lemuroid</b><span id="overlayText">Conectando à TV…</span></div>
<div id="rotate">Gire o celular na horizontal para usar o controle.</div>

<script>
(function () {
  var COLORS = ['#e03131', '#3b5bdb', '#2f9e44', '#f08c00'];
  var ws = null;
  var connected = false;
  var overlay = document.getElementById('overlay');
  var overlayText = document.getElementById('overlayText');
  var playerText = document.getElementById('playerText');
  var dot = document.querySelector('#player .dot');

  function send(msg) {
    if (ws && ws.readyState === 1) ws.send(msg);
  }

  function vibrate() {
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
  }

  function connect() {
    try { ws = new WebSocket('ws://' + location.host + '/ws'); } catch (e) { retry(); return; }
    ws.onopen = function () { connected = true; overlay.classList.add('hidden'); };
    ws.onmessage = function (ev) {
      var p = String(ev.data).split(' ');
      if (p[0] === 'p') {
        var n = parseInt(p[1], 10);
        if (n > 0) {
          playerText.textContent = 'Jogador ' + n;
          dot.style.background = COLORS[(n - 1) % COLORS.length];
        } else {
          playerText.textContent = 'Sem vaga livre';
          dot.style.background = '#777';
        }
        var main = p[2] === '1';
        document.querySelectorAll('.shortcut').forEach(function (el) { el.classList.toggle('hidden', !main); });
      }
    };
    ws.onclose = function () {
      connected = false;
      releaseEverything();
      overlayText.textContent = 'Sem conexão com a TV. Tentando de novo… (o jogo precisa estar aberto e os dois no mesmo Wi-Fi)';
      overlay.classList.remove('hidden');
      retry();
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  var retryTimer = null;
  function retry() {
    if (retryTimer) return;
    retryTimer = setTimeout(function () { retryTimer = null; connect(); }, 2000);
  }

  setInterval(function () { send('h'); }, 1000);

  // ----- buttons (multi-touch, with sliding between buttons) -----
  var pointers = {};           // pointerId -> {key: element|null, dpad: bool}
  var keyCount = {};           // keyCode -> number of fingers holding it
  var dpadPointers = {};       // pointerId -> [x, y]
  var lastDpad = '0 0';
  var dpad = document.getElementById('dpad');
  var lit = { u: document.getElementById('lu'), d: document.getElementById('ld'), l: document.getElementById('ll'), r: document.getElementById('lr') };

  function pressKey(el) {
    var k = el.getAttribute('data-key');
    keyCount[k] = (keyCount[k] || 0) + 1;
    if (keyCount[k] === 1) { send('k ' + k + ' 1'); el.classList.add('pressed'); vibrate(); }
  }

  function releaseKey(el) {
    var k = el.getAttribute('data-key');
    if (!keyCount[k]) return;
    keyCount[k] -= 1;
    if (keyCount[k] === 0) { send('k ' + k + ' 0'); el.classList.remove('pressed'); }
  }

  function updateDpad() {
    var x = 0, y = 0;
    for (var id in dpadPointers) { x += dpadPointers[id][0]; y += dpadPointers[id][1]; }
    x = Math.max(-1, Math.min(1, x)); y = Math.max(-1, Math.min(1, y));
    var s = x + ' ' + y;
    lit.u.classList.toggle('on', y < 0); lit.d.classList.toggle('on', y > 0);
    lit.l.classList.toggle('on', x < 0); lit.r.classList.toggle('on', x > 0);
    if (s !== lastDpad) { lastDpad = s; send('d ' + s); if (s !== '0 0') vibrate(); }
  }

  function dpadDirection(cx, cy) {
    var r = dpad.getBoundingClientRect();
    var dx = (cx - (r.left + r.width / 2)) / (r.width / 2);
    var dy = (cy - (r.top + r.height / 2)) / (r.height / 2);
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.22) return [0, 0];
    var angle = Math.atan2(dy, dx);              // -PI..PI, 0 = right
    var sector = Math.round(angle / (Math.PI / 4)); // 8 directions
    var dirs = { '0': [1, 0], '1': [1, 1], '2': [0, 1], '3': [-1, 1], '4': [-1, 0], '-4': [-1, 0], '-3': [-1, -1], '-2': [0, -1], '-1': [1, -1] };
    return dirs[String(sector)] || [0, 0];
  }

  function insideDpadZone(cx, cy) {
    var r = document.getElementById('left').getBoundingClientRect();
    return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
  }

  function buttonAt(cx, cy) {
    var el = document.elementFromPoint(cx, cy);
    while (el && el !== document.body) {
      if (el.classList && el.classList.contains('btn')) return el;
      el = el.parentNode;
    }
    return null;
  }

  function onDown(e) {
    e.preventDefault();
    var shortcut = e.target.closest ? e.target.closest('.shortcut') : null;
    if (shortcut) { send('a ' + shortcut.getAttribute('data-action')); shortcut.classList.add('pressed'); vibrate(); setTimeout(function () { shortcut.classList.remove('pressed'); }, 150); return; }

    if (insideDpadZone(e.clientX, e.clientY)) {
      pointers[e.pointerId] = { dpad: true };
      dpadPointers[e.pointerId] = dpadDirection(e.clientX, e.clientY);
      updateDpad();
      return;
    }
    var btn = buttonAt(e.clientX, e.clientY);
    pointers[e.pointerId] = { key: btn };
    if (btn) pressKey(btn);
  }

  function onMove(e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    e.preventDefault();
    if (p.dpad) {
      dpadPointers[e.pointerId] = dpadDirection(e.clientX, e.clientY);
      updateDpad();
      return;
    }
    var btn = buttonAt(e.clientX, e.clientY);
    if (btn !== p.key) {
      if (p.key) releaseKey(p.key);
      p.key = btn;
      if (btn) pressKey(btn);
    }
  }

  function onUp(e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    if (p.dpad) { delete dpadPointers[e.pointerId]; updateDpad(); }
    else if (p.key) releaseKey(p.key);
    delete pointers[e.pointerId];
  }

  function releaseEverything() {
    for (var id in pointers) { var p = pointers[id]; if (p.key) releaseKey(p.key); }
    pointers = {}; dpadPointers = {}; keyCount = {};
    document.querySelectorAll('.pressed').forEach(function (el) { el.classList.remove('pressed'); });
    updateDpad();
  }

  document.addEventListener('pointerdown', onDown, { passive: false });
  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // Release everything when the page goes to background (screen locked, app switched).
  document.addEventListener('visibilitychange', function () { if (document.hidden) releaseEverything(); });

  // First touch: try fullscreen + landscape lock (supported by Chrome on Android).
  document.addEventListener('pointerdown', function goFullscreen() {
    document.removeEventListener('pointerdown', goFullscreen);
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      try {
        var r = req.call(el);
        if (r && r.then) r.then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
        }).catch(function () {});
      } catch (e) {}
    }
  });

  connect();
})();
</script>
</body>
</html>
